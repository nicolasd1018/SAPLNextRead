<style>
    #conversation-container {
        display: flex;
        border: 2px solid #000000;
        width: 80vw;
        height: 70vh;
        margin-left: 20px;
        overflow-y: auto;
        flex-direction: column;
        gap: 10px;
        position: relative; /* Added to position the loader correctly */
    }
    #ai-buttons-container {
        display: flex;
        gap: 10px;
        flex-direction: column;
    }
    .user-message {
        background-color: #602983;
        color: #ffffff;
        padding: 10px;
        border-radius: 5px;
        align-self: flex-end;
    }
    .ai-message {
        padding: 10px;
        border-radius: 5px;
    }
    #user-input {
        margin-left: 20px;
        margin-top: 10px;
        width: 80vw !important;
    }
    .loader{
        display: flex;             /* Toggle to 'flex' via JS when loading */
        align-items: center;
        justify-content: center;   /* Centers content horizontally without left/transform */
        position: sticky;          /* Sticks to the visible bottom edge while scrolling */
        bottom: 20px;              /* 20px above the visible bottom edge */
        top: 20px;
        width: fit-content;        /* Shrinks box to loader size so margin auto works */
        margin: 0 auto;            /* Centers horizontally cleanly inside sticky flow */
        z-index: 10;               /* Ensures it floats above scrolling text */
    }
    /* Creating the dots */
    span{
    height: 5px;
    width: 5px;
    margin-right: 10px;
    border-radius: 50%;
    background-color: #602983;
    animation: loading 1s linear infinite;
    }
    /* Creating the loading animation*/
    @keyframes loading {
    0%{
        transform: translateX(0);
    }
    25%{
        transform: translateX(3px);
    }
    50%{
        transform: translateX(-3px);
    }
    100%{
        transform: translateX(0);
    }
    
    }

    span:nth-child(1){
        animation-delay: 0.1s;
    }
    span:nth-child(2){
        animation-delay: 0.2s;
    }
    span:nth-child(3){
        animation-delay: 0.3s;
    }
    span:nth-child(4){
        animation-delay: 0.4s;
    }
    span:nth-child(5){
        animation-delay: 0.5s;
    }
</style>
<div style="display: flex; flex-direction: row; margin-top: 20px; gap: 15px;">
    <div style="display: flex; flex-direction: column;">
        <div id="conversation-container">
                
        </div>
        <input type="text" id="user-input" placeholder="Type your message here..." />
    </div>
    <div id="ai-buttons-container">
        <button id="ai-profile-button">AI Profile</button>
        <button id="expand-horizon-button">Expand Horizons</button>
        <button id="plan-reading-goal-button">Plan Reading Goal</button>
    </div>
</div>
