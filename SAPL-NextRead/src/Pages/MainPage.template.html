<style>
    #SNR-main-container{
        display: flex;
        flex-direction: column;
    }
    #search-rows{
        display: flex;
        height: 45px;
        align-items: center;
        border-bottom: 5px solid #602983;
        justify-content: space-between;
    }
    nextread-searchbar{
        display: flex;
    }
    #book-carousel{
        display: flex;
        position: absolute;
        width: 100vw;
        justify-content: space-between;
        top: 55%;
        align-items: center;
    }
    #left-arrow{
        width: 149px;
        height: 121px;
        left: -18px;
    }
    #book-space{
        display: flex; 
        align-items: center; 
        height: calc(23vw*1.5);
        gap: 10vw;
    }
    #right-arrow{
        transform: scaleX(-1); 
        width: 149px;
        height: 121px; right: -18px;
    }
    #loading-screen{
        position: absolute;
        display: none;
    }
    #filter-button{
        margin-right: 10px;
        height: 29px;
        width: 158px;
        background-color: white;
        font-size: 24px;
        font-weight: bold;
        :hover{
            cursor: pointer;
        }
    }
    #filter-button:hover { 
        cursor: pointer; 
    }
    .book-cover{
        border:  2px #602983 solid;
    }
    .book-cover:hover{
        cursor: pointer;
    }
    filter-modal{
        display: none;
    }
    error-modal{
        display: none;
    }
    #books-like{
        display: none;
        width: 100%;
        justify-content: center;
        align-items: center;
        flex-direction: row;
        gap: 5px;
        font-size: 24px;
    }
    #book-title{
        color: #02729e;
    }
    #searched-cover {
        width: 10vw;
        height: calc(10vw * 1.5);
    }
    #book-title:hover{
        cursor: pointer;
    }
    #searched-cover:hover {
        cursor: pointer;
    }
    #authored-books {
        overflow-y: auto; 
        display: none;
        flex-direction: column;
        height: 100px;
        width: 500px;
        justify-self: center;
    }
    #authored-books div {
    display: inline-block; 
    text-align: center;
    text-decoration: none;     /* Removes underlines */
    }
    #books-like-holder{
        justify-content: center;
        align-items: center;
        display: flex;
        flex-direction: column;
    }
    #author-submit{
        border:  2px #602983 solid;
        background-color: #602983;
        color: white;
        display: none;
    }
    #author-submit:hover{
        cursor: pointer;
    }
</style>

<error-modal id="error-modal"></error-modal>
<nextread-loading-screen id="loading-screen"></nextread-loading-screen>
<filter-modal id="filter-modal"></filter-modal>
<div id="SNR-main-container" aria-label="mainPageContainer">
    <div id="search-rows" >
        <nextread-searchbar></nextread-searchbar>
        <button id="filter-button">Filter</button>
    </div>
    <div id="books-like-holder">
        <div id="books-like">
            <div id="helper-text">Books like</div>
            <div id="book-title"></div>
            <img id="searched-cover">
        </div>
        <div id="authored-books">
        </div>
        <button id="author-submit">Submit</button>
    </div>
    <div id="book-carousel">
         <img id="left-arrow" src="/Arrow.png" />
        <div id="book-space"></div>
        <img id="right-arrow" src="/Arrow.png" />
    </div>
</div>
