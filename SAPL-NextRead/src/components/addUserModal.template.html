<style>
    #modal-background {
        display: flex; 
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        top: 0;
        left: 0;
        z-index: 9999;
        justify-content: center;
        justify-items: center;
        align-items: center;
        position: fixed;
    }
    #error-container{
        background-color: white;
        display: flex;
        padding: 10px;
        width: 600px;
        flex-direction: column;
        gap: 10px;
        align-items: center;
    }
    #close-button{
        width: fit-content;
    }
    #title{
        font-weight: bold;
        font-size: large;
    }
    .horizontal-container {
        flex-direction: row;
        display: flex;
        width: 550px;
        justify-content: space-between;
        align-content: space-between;
    }
    #password:invalid {
        border: 2px dashed #ff4d4d;
    }
    #password {
        width: 400px;
    }
    #confirm-password {
        width: 400px;
    }
    #username {
        width: 400px;
    }
    #address {
        width: 400px;
    }
</style>

<div id="modal-background">
    <div id="error-container">
        <div id="title">Add User</div>
        <div class="horizontal-container">
            <label title="First Name" for="first-name">First Name</label>
            <input title="First Name" type="text" id="first-name"></input>
            <label title="Last Name" for="last-name">Last Name</label>
            <input title="Last Name" type="text" id="last-name"></input>
        </div>
        <div class="horizontal-container">
            <label title="Email" for="email">Email</label>
            <input title="Email" type="email" id="email"></input>
            <label title="Gender" for="gender">Gender</label>
            <select title="Gender" id="gender">
                <option value="">Select Gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="non-binary">Non-binary</option>
                <option value="other">Other</option>
                <option value="prefer-not-to-say">Prefer not to say</option>
            </select>
        </div>
        <div class="horizontal-container">
            <label title="address" for="address">Address</label>
            <input title="address" type="text" id="address"></input>
        </div>
        <div class="horizontal-container">
            <label for="username">Username*</label>
            <input id="username"  minlength="4" required></input>
        </div>
        <div class="horizontal-container">
            <label title="Needs to be 8 characters long" for="password">Password</label>
            <input title="Needs to be 8 characters long" type="password" required minlength="8" id="password"></input>
        </div>
        <div class="horizontal-container">
            <label title="Needs to match password" for="confirm-password">Confirm Password</label>
            <input title="Needs to match password" type="password" id="confirm-password"></input>
        </div>
        <div class="horizontal-container">
            <button id="close-button">Close</button>
            <button disabled id="save-button">Create New User</button>
        </div>
    </div>
</div>
